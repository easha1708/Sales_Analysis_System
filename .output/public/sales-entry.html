<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Entry | Sales Analysis System</title>
    <meta
      name="description"
      content="Record a sale with date, product, quantity, amount and person category."
    />
    <link rel="stylesheet" href="css/sales-entry.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">SAS</div>
          <div>
            <h1>Sales Analysis</h1>
            <p>ADMIN PANEL</p>
          </div>
        </div>
        <nav class="nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="sales-entry.html" class="active">Sales Entry</a>
          <a href="search.html">Search &amp; Analysis</a>
          <a href="reports.html">Reports</a>
          <a href="settings.html">Settings</a>
          <a href="#" data-logout>Logout</a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h2>Sales Entry</h2>
            <div class="sub">Add, edit and delete sales records</div>
          </div>
          <div class="user-chip">
            <span data-admin-name>Administrator</span>
            <div class="avatar" data-admin-initial>A</div>
          </div>
        </header>

        <div class="content">
          <section class="card">
            <div class="card-head">
              <h3 id="formTitle">New Sale</h3>
              <span class="hintline">All fields are required</span>
            </div>
            <div class="card-body">
              <form id="saleForm" novalidate>
                <input type="hidden" id="saleId" value="" />
                <div class="form-grid">
                  <div class="field">
                    <label for="saleDate">Sale Date</label>
                    <input
                      type="date"
                      id="saleDate"
                      max=""
                      aria-describedby="errDate"
                    />
                    <span class="err" id="errDate"></span>
                  </div>
                  <div class="field">
                    <label for="product">Product Name</label>
                    <input
                      type="text"
                      id="product"
                      placeholder="e.g. Shoes"
                      list="productSuggestions"
                    />
                    <datalist id="productSuggestions"></datalist>
                    <span class="err" id="errProduct"></span>
                  </div>
                  <div class="field">
                    <label for="quantity">Quantity Sold</label>
                    <input
                      type="number"
                      id="quantity"
                      min="1"
                      step="1"
                      placeholder="e.g. 5"
                    />
                    <span class="err" id="errQuantity"></span>
                  </div>
                  <div class="field">
                    <label for="amount">Sale Amount (&#8377;)</label>
                    <input
                      type="number"
                      id="amount"
                      min="0"
                      step="0.01"
                      placeholder="e.g. 4500"
                    />
                    <span class="err" id="errAmount"></span>
                  </div>
                  <div class="field">
                    <label for="category">Person Category</label>
                    <select id="category"></select>
                    <span class="err" id="errCategory"></span>
                  </div>
                </div>
                <div class="actions">
                  <button type="submit" id="saveBtn">SAVE SALE</button>
                  <button type="reset" class="btn-ghost" id="resetBtn">
                    RESET
                  </button>
                  <button
                    type="button"
                    class="btn-ghost"
                    id="cancelEdit"
                    style="display: none"
                  >
                    CANCEL EDIT
                  </button>
                </div>
              </form>
            </div>
          </section>

          <section class="card" style="margin-top: 18px">
            <div class="card-head">
              <h3>Saved Sales Records</h3>
              <button class="btn-ghost btn-sm no-print" id="exportBtn">
                Export CSV
              </button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Product</th>
                    <th class="num">Quantity</th>
                    <th>Person Category</th>
                    <th class="num">Amount</th>
                    <th class="no-print">Action</th>
                  </tr>
                </thead>
                <tbody id="salesBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="modal-bg" id="confirmModal">
      <div class="modal">
        <h3 class="m-title">Confirm</h3>
        <p class="m-text">Are you sure?</p>
        <div class="actions">
          <button class="m-yes btn-danger">Yes, continue</button>
          <button class="m-no btn-ghost">Cancel</button>
        </div>
      </div>
    </div>
    <div id="toasts"></div>
    <script src="js/common.js"></script>
    <script src="js/sales.js"></script>
  </body>
</html>

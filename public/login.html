<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Sales Analysis System</title>
    <meta
      name="description"
      content="Admin login for the Sales Analysis System - track sales, analyze performance and generate reports."
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-page">
      <section class="login-left">
        <div class="logo" aria-label="Sales Analysis System logo">
          <span class="logo-letter">S</span>
          <span class="logo-letter logo-letter-main">A</span>
          <span class="logo-letter">S</span>
        </div>
        <h1>Sales Analysis<br />System</h1>
        <div class="panel-meta">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Secure access portal</span>
        </div>
      </section>

      <section class="login-right">
        <div class="login-card">
          <h2>Admin Login</h2>
          <p class="sub">
            Sign in to continue to the administration dashboard.
          </p>

          <div class="alert" id="alertBox"></div>

          <form id="loginForm" novalidate>
            <div class="field">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
              />
              <span class="err" id="errUsername"></span>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="pw-wrap">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter password"
                  autocomplete="current-password"
                />
                <button type="button" class="pw-toggle" id="pwToggle">
                  Show
                </button>
              </div>
              <span class="err" id="errPassword"></span>
            </div>

            <div class="row-between">
              <label class="check"
                ><input type="checkbox" id="remember" /> Remember me</label
              >
              <span class="hintline">Secure admin area</span>
            </div>

            <button type="submit" class="btn-block">LOGIN</button>
          </form>
        </div>
      </section>
    </div>

    <div id="toasts"></div>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
